# Builds the Astro site (including the static JSON API under /api/v1) and
# publishes it to the Cloudflare Pages project `govwait`.
name: deploy-site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/exports/**", "machine/openapi.yaml", "pipeline/indexnow.js"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        run: cd site && npm ci
      - name: Build API + site
        env:
          SITE_URL: ${{ vars.SITE_URL }} # falls back to site.config.json placeholder if unset
        run: |
          node pipeline/build-api.js
          cp machine/openapi.yaml site/public/api/v1/openapi.yaml
          cd site && npx astro build
      - name: Fix robots.txt sitemap host
        if: ${{ vars.SITE_URL != '' }}
        run: sed -i "s#https://govwait.example#${{ vars.SITE_URL }}#g" site/dist/robots.txt
      - name: Audit search and crawler discoverability
        run: cd site && npm run audit:seo
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=govwait --branch=main
      - name: Notify IndexNow participants after production deploy
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node pipeline/indexnow.js || echo "IndexNow notification failed (non-fatal)"
