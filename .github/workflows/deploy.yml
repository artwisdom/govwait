# Builds the Astro site (including the static JSON API under /api/v1) and
# publishes it to the Cloudflare Pages project `govwait`.
name: deploy-site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/exports/**", "machine/openapi.yaml", "pipeline/build-api.js", "pipeline/indexnow.js"]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Optional full main-branch commit SHA to deploy"
        required: false
        type: string
  workflow_call:
    inputs:
      commit_sha:
        description: "Full validated refresh commit SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    # GITHUB_TOKEN bot pushes are normally suppressed by GitHub. Keep this
    # guard so a future token/config change cannot duplicate the explicit call
    # made by refresh.yml.
    if: ${{ github.event_name != 'push' || (github.actor != 'github-actions[bot]' && github.event.head_commit.author.email != 'actions@users.noreply.github.com') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 2
      - name: Verify exact refresh revision is still main
        if: ${{ inputs.commit_sha != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $actual_sha instead of requested refresh commit $EXPECTED_SHA"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$main_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::main advanced to $main_sha after refresh commit $EXPECTED_SHA; refusing a stale deploy"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        run: cd site && npm ci
      - name: Build API + site
        env:
          SITE_URL: ${{ vars.SITE_URL }} # falls back to site.config.json placeholder if unset
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
        run: |
          node pipeline/build-api.js
          cp machine/openapi.yaml site/public/api/v1/openapi.yaml
          cd site && npx astro build
      - name: Fix robots.txt sitemap host
        if: ${{ vars.SITE_URL != '' }}
        run: sed -i "s#https://govwait.example#${{ vars.SITE_URL }}#g" site/dist/robots.txt
      - name: Audit search and crawler discoverability
        run: cd site && npm run audit:seo
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=govwait --branch=main
      - name: Notify IndexNow participants after production deploy
        if: ${{ vars.SITE_URL != '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node pipeline/indexnow.js || echo "IndexNow notification failed (non-fatal)"
